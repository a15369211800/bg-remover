<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Background Remover</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 48px 40px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { color: #222; font-size: 26px; margin-bottom: 10px; }
        p { color: #666; font-size: 15px; margin-bottom: 24px; }
        .credits-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            padding: 10px 28px;
            border-radius: 30px;
            margin-bottom: 28px;
        }
        .btn {
            display: block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .counter { color: #aaa; font-size: 13px; margin-top: 14px; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🎉</div>
    <h1>Payment Successful!</h1>
    <p id="desc">Your credits have been added to your account.</p>
    <div class="credits-badge" id="creditsBadge">Loading...</div>
    <a href="index.html" class="btn">Start Removing Backgrounds →</a>
    <p class="counter" id="counter">Redirecting in 5s...</p>
</div>

<script>
// Read URL params: ?plan=member_monthly&subscription_id=xxx  OR  ?plan=pack_1
const params = new URLSearchParams(window.location.search);
const plan = params.get('plan') || '';
const subscriptionId = params.get('subscription_id') || '';

// Plan → credits mapping
const PLAN_CREDITS = {
    member_monthly: 100,
    super_monthly:  300,
    pack_1:         1,
    pack_10:        10,
};

const PLAN_NAMES = {
    member_monthly: 'Member Plan',
    super_monthly:  'Super Member Plan',
    pack_1:         'Single Removal',
    pack_10:        'Starter Pack',
};

async function processSuccess() {
    let credits = 0;

    if (subscriptionId && plan) {
        // Subscription: verify with backend
        try {
            const res = await fetch('https://api.background-remover.website/api/subscriptions/activate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ subscriptionId, plan })
            });
            const result = await res.json();
            if (result.success) {
                credits = result.credits;
            }
        } catch (e) {
            console.error(e);
        }
        // Even if backend fails, give credits based on plan
        if (credits === 0) credits = PLAN_CREDITS[plan] || 0;
    } else if (plan) {
        credits = PLAN_CREDITS[plan] || 0;
    }

    // Add credits to localStorage
    if (credits > 0) {
        const today = new Date();
        const key = `bgRemoverQuota_${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
        const current = parseInt(localStorage.getItem(key) || '0', 10);
        localStorage.setItem(key, (current + credits).toString());
    }

    // Update UI
    const planName = PLAN_NAMES[plan] || 'Your plan';
    document.getElementById('desc').textContent = `${planName} activated successfully!`;
    document.getElementById('creditsBadge').textContent = credits > 0 ? `+${credits} credits added` : 'Plan activated!';

    // Auto redirect countdown
    let secs = 5;
    const counter = document.getElementById('counter');
    const interval = setInterval(() => {
        secs--;
        counter.textContent = `Redirecting in ${secs}s...`;
        if (secs <= 0) {
            clearInterval(interval);
            window.location.href = 'index.html';
        }
    }, 1000);
}

processSuccess();
</script>
</body>
</html>
