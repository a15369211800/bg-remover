<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Remover - Free Online Background Removal Tool</title>
    <meta name="description" content="Remove image backgrounds instantly for free. No signup required. AI-powered background remover supports PNG, JPG, WEBP.">
    <meta property="og:title" content="Background Remover - Free Online Tool">
    <meta property="og:description" content="Remove image backgrounds instantly and for free. No signup, no software to install.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://background-remover.website/">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Background Remover",
      "url": "https://background-remover.website/",
      "description": "Free online AI-powered background removal tool.",
      "applicationCategory": "UtilityApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
    <!-- Google Identity Services -->
    <!-- Google login removed: no longer required -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 560px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }

        /* Header with login */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Lang toggle */
        .lang-toggle {
            display: flex;
            justify-content: flex-end;
        }
        .lang-btn {
            background: none;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 13px;
            cursor: pointer;
            color: #666;
            transition: all 0.2s;
        }
        .lang-btn:hover { border-color: #667eea; color: #667eea; }

        /* User info / login */
        .user-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-info {
            display: none;
            align-items: center;
            gap: 8px;
        }
        .user-info.active { display: flex; }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }
        .user-name {
            font-size: 13px;
            color: #333;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .logout-btn {
            background: none;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
            color: #666;
            transition: all 0.2s;
        }
        .logout-btn:hover { border-color: #e74c3c; color: #e74c3c; }

        /* Google Sign In button container */
        #g_id_signin {
            display: block;
        }

        h1 {
            text-align: center;
            color: #222;
            font-size: 24px;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Free quota display */
        .quota-display {
            text-align: center;
            background: linear-gradient(135deg, #667eea20, #764ba220);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 20px;
            border: 2px solid #667eea40;
        }
        .quota-display.free {
            background: linear-gradient(135deg, #22c55e20, #16a34a20);
            border-color: #22c55e40;
        }
        .quota-display.low {
            background: linear-gradient(135deg, #f59e0b20, #d9770620);
            border-color: #f59e0b40;
        }
        .quota-display.exhausted {
            background: linear-gradient(135deg, #ef444420, #dc262620);
            border-color: #ef444440;
        }
        .quota-text {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        .quota-number {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
        }
        .quota-display.free .quota-number { color: #16a34a; }
        .quota-display.low .quota-number { color: #d97706; }
        .quota-display.exhausted .quota-number { color: #dc2626; }

        /* Upgrade banner */
        .upgrade-banner {
            display: none;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            color: white;
        }
        .upgrade-banner.active { display: block; }
        .upgrade-banner h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .upgrade-banner p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 12px;
        }
        .upgrade-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .upgrade-btn:hover { transform: scale(1.05); }

        /* Upload */
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 14px;
            padding: 48px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #f8f9ff;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #764ba2;
            background: #eeefff;
        }
        .upload-area.disabled {
            border-color: #ccc;
            background: #f5f5f5;
            cursor: not-allowed;
            opacity: 0.6;
        }
        input[type="file"] { display: none; }
        .upload-icon { font-size: 40px; margin-bottom: 10px; }
        .upload-main { font-size: 16px; color: #333; margin-bottom: 6px; }
        .upload-main strong { color: #667eea; }
        .upload-hint { font-size: 13px; color: #aaa; }

        /* Loading */
        .loading { display: none; text-align: center; padding: 28px 0; }
        .loading.active { display: block; }
        .spinner {
            border: 4px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            width: 42px; height: 42px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { color: #666; font-size: 14px; }

        /* Error */
        .error {
            display: none;
            background: #fff0f0;
            color: #c0392b;
            border-left: 4px solid #e74c3c;
            border-radius: 8px;
            padding: 12px 14px;
            margin-top: 14px;
            font-size: 14px;
            gap: 8px;
            align-items: center;
        }
        .error.active { display: flex; }

        /* Preview */
        .preview { display: none; margin-top: 4px; }
        .preview.active { display: block; }

        .image-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .image-box {
            border: 2px solid #eee;
            border-radius: 10px;
            overflow: hidden;
        }
        .image-box img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            display: block;
            background: repeating-conic-gradient(#ddd 0% 25%, #fff 0% 50%) 0 0 / 14px 14px;
        }
        .image-label {
            text-align: center;
            padding: 6px;
            background: #fafafa;
            font-size: 12px;
            color: #777;
            font-weight: 600;
            border-top: 1px solid #eee;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
            margin-top: 10px;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }
        .btn-secondary:hover { background: #e4e4e4; }

        @media (max-width: 480px) {
            .card { padding: 28px 20px; }
            .image-row { grid-template-columns: 1fr; }
            h1 { font-size: 20px; }
            .header { flex-direction: column; align-items: stretch; }
            .user-section { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="card">

    <!-- Header with language toggle and login -->
    <div class="header">
        <div class="lang-toggle">
            <button class="lang-btn" id="langBtn" onclick="toggleLang()">中文</button>
        </div>
        <div class="user-section">
            <!-- Upgrade link -->
            <a href="pricing.html" style="font-size:13px;color:#667eea;text-decoration:none;border:1px solid #667eea;border-radius:16px;padding:4px 12px;">⚡ Upgrade</a>
        </div>
    </div>

    <h1 id="title">AI Background Remover</h1>
    <p class="subtitle" id="subtitle">Free · No signup · Instant results</p>

    <!-- Free Quota Display -->
    <div class="quota-display" id="quotaDisplay">
        <span class="quota-text">Free removals today: </span>
        <span class="quota-number" id="quotaNumber">2/2</span>
    </div>

    <!-- Upgrade Banner (shown when quota exhausted) -->
    <div class="upgrade-banner" id="upgradeBanner">
        <h3 id="upgradeTitle">You've used all free removals</h3>
        <p id="upgradeDesc">Upgrade to continue removing backgrounds</p>
        <button class="upgrade-btn" onclick="showPricing()">View Plans</button>
    </div>

    <!-- Upload -->
    <div class="upload-area" id="uploadArea">
        <div class="upload-icon">🖼️</div>
        <p class="upload-main" id="uploadMain"><strong>Click to upload</strong> or drag & drop</p>
        <p class="upload-hint" id="uploadHint">PNG · JPG · WEBP · Max 10 MB</p>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp">
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p id="loadingText">Removing background…</p>
    </div>

    <!-- Error -->
    <div class="error" id="error" role="alert">
        <span>⚠️</span><span id="errorText"></span>
    </div>

    <!-- Result -->
    <div class="preview" id="preview">
        <div class="image-row">
            <div class="image-box">
                <img id="originalImg" alt="Original">
                <div class="image-label" id="labelOriginal">Original</div>
            </div>
            <div class="image-box">
                <img id="resultImg" alt="Result">
                <div class="image-label" id="labelResult">Background Removed ✅</div>
            </div>
        </div>
        <button class="btn btn-primary" id="downloadBtn">⬇️ <span id="downloadText">Download PNG</span></button>
        <button class="btn btn-secondary" id="newBtn">🔄 <span id="newText">Try Another Image</span></button>
    </div>

</div>

<script>
// ── i18n ─────────────────────────────────────────────────────────────────────
const i18n = {
    en: {
        title: 'AI Background Remover',
        subtitle: 'Free · No signup · Instant results',
        uploadMain: '<strong>Click to upload</strong> or drag & drop',
        uploadHint: 'PNG · JPG · WEBP · Max 10 MB',
        loadingText: 'Removing background…',
        labelOriginal: 'Original',
        labelResult: 'Background Removed ✅',
        downloadText: 'Download PNG',
        newText: 'Try Another Image',
        langBtn: '中文',
        errSize: 'File too large. Please upload an image under 10 MB.',
        errType: 'Unsupported file type. Please use PNG, JPG, or WEBP.',
        errTimeout: 'Request timed out (30s). Please check your connection and try again.',
        errQuota: 'Free quota exceeded. Please try again tomorrow.',
        errInvalid: 'Invalid image. Please try a different file.',
        errRate: 'Too many requests. Please wait a moment and try again.',
        errGeneric: 'Something went wrong. Please try again.',
        quotaText: 'Removals left: ',
        upgradeTitle: 'No removals left',
        upgradeDesc: 'Upgrade to continue removing backgrounds',
        upgradeBtn: 'View Plans',
    },
    zh: {
        title: 'AI 智能抠图',
        subtitle: '免费 · 无需注册 · 即时出图',
        uploadMain: '<strong>点击上传</strong>或拖拽图片至此',
        uploadHint: '支持 PNG · JPG · WEBP · 最大 10 MB',
        loadingText: '正在去除背景，请稍候…',
        labelOriginal: '原图',
        labelResult: '已去除背景 ✅',
        downloadText: '下载 PNG',
        newText: '处理另一张图',
        langBtn: 'English',
        errSize: '文件过大，请上传 10 MB 以内的图片。',
        errType: '不支持的文件格式，请使用 PNG、JPG 或 WEBP。',
        errTimeout: '请求超时（30秒），请检查网络后重试。',
        errQuota: '今日免费额度已用完，请明天再试。',
        errInvalid: '图片无效，请换一张图片试试。',
        errRate: '请求过于频繁，请稍后再试。',
        errGeneric: '出现错误，请重试。',
        quotaText: '剩余次数：',
        upgradeTitle: '次数已用完',
        upgradeDesc: '升级会员继续去除背景',
        upgradeBtn: '查看套餐',
    }
};

let lang = 'en';

function applyLang() {
    const t = i18n[lang];
    document.getElementById('title').textContent = t.title;
    document.getElementById('subtitle').textContent = t.subtitle;
    document.getElementById('uploadMain').innerHTML = t.uploadMain;
    document.getElementById('uploadHint').textContent = t.uploadHint;
    document.getElementById('loadingText').textContent = t.loadingText;
    document.getElementById('labelOriginal').textContent = t.labelOriginal;
    document.getElementById('labelResult').textContent = t.labelResult;
    document.getElementById('downloadText').textContent = t.downloadText;
    document.getElementById('newText').textContent = t.newText;
    document.getElementById('langBtn').textContent = t.langBtn;
    document.documentElement.lang = lang;
    updateQuotaDisplay();
}

function toggleLang() {
    lang = lang === 'en' ? 'zh' : 'en';
    applyLang();
}

window.getT = (key) => i18n[lang][key] || key;
applyLang();

// ── Quota ─────────────────────────────────────────────────────────────────────
const DAILY_FREE_QUOTA = 2;

function getQuotaKey() {
    const now = new Date();
    return 'bgRemoverQuota_' + now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
}

function getTodayQuota() {
    const v = localStorage.getItem(getQuotaKey());
    return v !== null ? parseInt(v, 10) : DAILY_FREE_QUOTA;
}

function useQuota() {
    const cur = getTodayQuota();
    if (cur <= 0) return false;
    localStorage.setItem(getQuotaKey(), String(cur - 1));
    updateQuotaDisplay();
    return true;
}

function updateQuotaDisplay() {
    const quota = getTodayQuota();
    const t = i18n[lang];
    const qn = document.getElementById('quotaNumber');
    if (qn) qn.textContent = quota;
    const qt = document.querySelector('.quota-text');
    if (qt) qt.textContent = t.quotaText;

    const qd = document.getElementById('quotaDisplay');
    if (qd) {
        qd.classList.remove('free', 'low', 'exhausted');
        if (quota >= DAILY_FREE_QUOTA) qd.classList.add('free');
        else if (quota > 0) qd.classList.add('low');
        else qd.classList.add('exhausted');
    }

    const banner = document.getElementById('upgradeBanner');
    const area = document.getElementById('uploadArea');
    if (quota <= 0) {
        if (banner) banner.classList.add('active');
        if (area) area.classList.add('disabled');
        const ut = document.getElementById('upgradeTitle');
        const ud = document.getElementById('upgradeDesc');
        const ub = document.querySelector('.upgrade-btn');
        if (ut) ut.textContent = t.upgradeTitle;
        if (ud) ud.textContent = t.upgradeDesc;
        if (ub) ub.textContent = t.upgradeBtn;
    } else {
        if (banner) banner.classList.remove('active');
        if (area) area.classList.remove('disabled');
    }
}

function showPricing() { window.location.href = 'pricing.html'; }

window.showPricing = showPricing;
window.checkQuota = function() { if (getTodayQuota() <= 0) { showPricing(); return false; } return true; };
window.useQuota = useQuota;
window.getTodayQuota = getTodayQuota;
window.getQuotaKey = getQuotaKey;

document.addEventListener('DOMContentLoaded', updateQuotaDisplay);
</script>
<script src="app.js"></script>
</body>
</html>
