<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Remover - Free Online Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
        }
        input[type="file"] { display: none; }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .preview {
            margin-top: 30px;
            display: none;
        }
        .preview.active { display: block; }
        .image-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .image-box {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            background: #f5f5f5;
        }
        .image-box img {
            width: 100%;
            height: auto;
            display: block;
        }
        .image-label {
            text-align: center;
            padding: 10px;
            background: #f9f9f9;
            font-size: 14px;
            color: #666;
            font-weight: 600;
        }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .loading.active { display: block; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }
        .error.active { display: block; }
        @media (max-width: 600px) {
            .image-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Background Remover</h1>
        <p class="subtitle">Remove image backgrounds in seconds</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📸</div>
            <p style="font-size: 18px; color: #333; margin-bottom: 10px;">
                <strong>Click to upload</strong> or drag and drop
            </p>
            <p style="color: #999; font-size: 14px;">PNG, JPG up to 10MB</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Removing background...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="preview" id="preview">
            <div class="image-container">
                <div class="image-box">
                    <img id="originalImg" alt="Original">
                    <div class="image-label">Original</div>
                </div>
                <div class="image-box">
                    <img id="resultImg" alt="Result">
                    <div class="image-label">Background Removed</div>
                </div>
            </div>
            <button class="btn" id="downloadBtn">Download Result</button>
            <button class="btn" id="newBtn" style="background: #6c757d;">Upload Another</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
